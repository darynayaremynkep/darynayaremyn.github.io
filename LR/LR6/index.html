<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="generator">
    <h1>CSS Generator</h1>

    <div class="tabs" id="tabs">
      <button class="tab active" type="button" data-tab="radius">Border Radius</button>
      <button class="tab" type="button" data-tab="property-2">Gap</button>
      <button class="tab" type="button" data-tab="property-3">Flex Direction</button>
    </div>

    <div class="tab-content active" data-content="radius">
      <h2>Border Radius</h2>
      <div class="control">
        <label for="top-left">Top Left</label>
        <input id="top-left" type="range" min="0" max="100" value="0">
        <span id="top-left-value">0 px</span>
      </div>
      <div class="control">
        <label for="top-right">Top Right</label>
        <input id="top-right" type="range" min="0" max="100" value="0">
        <span id="top-right-value">0 px</span>
      </div>
      <div class="control">
        <label for="bottom-right">Bottom Right</label>
        <input id="bottom-right" type="range" min="0" max="100" value="0">
        <span id="bottom-right-value">0 px</span>
      </div>
      <div class="control">
        <label for="bottom-left">Bottom Left</label>
        <input id="bottom-left" type="range" min="0" max="100" value="0">
        <span id="bottom-left-value">0 px</span>
      </div>
    </div>

    <div class="tab-content" data-content="property-2">
      <h2>Gap</h2>
      <div class="control">
        <label for="gap">Gap</label>
        <input id="gap" type="range" min="0" max="50" value="10">
        <span id="gap-value">10 px</span>
      </div>
    </div>

    <div class="tab-content" data-content="property-3">
      <h2>Flex Direction</h2>
      <div class="control select-control">
        <label for="flex-direction">Flex Direction</label>
        <select id="flex-direction">
          <option value="row">row</option>
          <option value="row-reverse">row-reverse</option>
          <option value="column">column</option>
          <option value="column-reverse">column-reverse</option>
        </select>
      </div>
    </div>

    <section class="preview-section">
      <h2>Preview</h2>
      <div id="preview" class="preview">
        <span class="preview-item">Item 1</span>
        <span class="preview-item">Item 2</span>
        <button id="preview-button" type="button">Click</button>
      </div>
      <p id="coordinates">X: 0; Y: 0</p>
    </section>

    <section class="result">
      <h2>CSS Code</h2>
      <textarea id="css-code" rows="8" readonly></textarea>
      <button id="copy-button" type="button">Скопіювати CSS</button>
      <p id="copy-message" aria-live="polite"></p>
    </section>

    <form id="preset-form" novalidate>
      <h2>Збереження пресета</h2>
      <label for="preset-name">Назва пресета</label>
      <input id="preset-name" type="text" autocomplete="off">
      <span id="preset-error" aria-live="polite"></span>
      <button type="submit">Зберегти</button>
    </form>
  </main>

  <button id="scroll-top" type="button" aria-label="Повернутися вгору">↑</button>
</body>
</html>
