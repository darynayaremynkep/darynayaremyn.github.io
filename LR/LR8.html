<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ToDo List</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card: #fff;
            --text: #222;
            --muted: #999;
            --line: #ccc;
            --accent: #e53935;
            --btn: #eee;
            --btn-on: #222;
            --btn-on-t: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #16181c;
                --card: #23262c;
                --text: #eee;
                --muted: #777;
                --line: #444;
                --btn: #2e323a;
                --btn-on: #eee;
                --btn-on-t: #111
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #16181c;
            --card: #23262c;
            --text: #eee;
            --muted: #777;
            --line: #444;
            --btn: #2e323a;
            --btn-on: #eee;
            --btn-on-t: #111
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
            padding: 24px 12px
        }

        .app {
            max-width: 460px;
            margin: 0 auto
        }

        h1 {
            text-align: center;
            font-size: 2.6rem;
            margin: 0 0 18px
        }

        .box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden
        }

        #newTask {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-size: 1rem;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            outline: none
        }

        #newTask:focus {
            background: rgba(127, 127, 127, .08)
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line)
        }

        li:last-child {
            border-bottom: 0
        }

        li input[type=checkbox] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex: none
        }

        .txt {
            flex: 1;
            min-width: 0;
            cursor: text;
            word-break: break-word
        }

        .date {
            display: block;
            font-size: .75rem;
            color: var(--muted);
            margin-top: 2px
        }

        li.done .txt {
            text-decoration: line-through;
            color: var(--muted)
        }

        li.done {
            padding-left: 42px
        }

        .edit {
            flex: 1;
            font: inherit;
            padding: 4px 6px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: transparent;
            color: var(--text)
        }

        .del {
            flex: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            line-height: 1
        }

        .del:hover {
            background: var(--accent);
            color: #fff
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 14px
        }

        .filters button {
            border: 0;
            background: var(--btn);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 16px;
            cursor: pointer;
            font: inherit;
            font-size: .85rem
        }

        .filters button.on {
            background: var(--btn-on);
            color: var(--btn-on-t)
        }

        .empty {
            padding: 18px;
            text-align: center;
            color: var(--muted)
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>ToDo List</h1>
        <div class="box">
            <input id="newTask" type="text" placeholder="Додайте завдання" autocomplete="off">
            <ul id="list"></ul>
        </div>
        <div class="filters" id="filters">
            <button data-f="all">Усі</button>
            <button data-f="active">Невиконані</button>
            <button data-f="done">Виконані</button>
            <button data-s="1">⇅ Виконані донизу</button>
        </div>
    </div>
    <script>
        const KEY = 'todo-list-v1';
        let tasks = [], filter = 'all', editId = null, sortOn = false;
        try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; filter = localStorage.getItem(KEY + '-f') || 'all'; sortOn = localStorage.getItem(KEY + '-s') === '1' } catch (e) { tasks = [] }
        function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); localStorage.setItem(KEY + '-f', filter); localStorage.setItem(KEY + '-s', sortOn ? '1' : '0') } catch (e) { } }
        const p = n => String(n).padStart(2, '0');
        function fmt(ts) { const d = new Date(ts); return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + p(d.getFullYear() % 100) + ', ' + p(d.getHours()) + ':' + p(d.getMinutes()) }
        const list = document.getElementById('list'), input = document.getElementById('newTask');
        function render() {
            list.innerHTML = '';
            document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('on', b.dataset.s ? sortOn : b.dataset.f === filter));
            let shown = tasks.filter(t => filter === 'all' || (filter === 'done') === t.done);
            if (sortOn) shown = shown.slice().sort((a, b) => a.done - b.done);
            if (!shown.length) { list.innerHTML = '<li class="empty" style="display:block">Завдань немає</li>'; return }
            shown.forEach(t => {
                const li = document.createElement('li');
                if (t.done) li.className = 'done';
                if (!t.done) { const cb = document.createElement('input'); cb.type = 'checkbox'; cb.onchange = () => { t.done = true; save(); render() }; li.appendChild(cb) }
                if (editId === t.id) {
                    const e = document.createElement('input'); e.className = 'edit'; e.value = t.text;
                    e.onkeydown = ev => {
                        if (ev.key === 'Enter') { const v = e.value.trim(); if (v) t.text = v; editId = null; save(); render() }
                        else if (ev.key === 'Escape') { editId = null; render() }
                    };
                    e.onblur = () => { if (editId === t.id) { editId = null; render() } };
                    li.appendChild(e);
                    setTimeout(() => { e.focus(); e.select() });
                } else {
                    const s = document.createElement('span'); s.className = 'txt';
                    s.textContent = t.text;
                    const d = document.createElement('span'); d.className = 'date'; d.textContent = fmt(t.time);
                    s.appendChild(d);
                    s.ondblclick = () => { editId = t.id; render() };
                    li.appendChild(s);
                }
                const x = document.createElement('button'); x.className = 'del'; x.textContent = '×'; x.title = 'Видалити';
                x.onclick = () => { tasks = tasks.filter(a => a.id !== t.id); save(); render() };
                li.appendChild(x);
                list.appendChild(li);
            });
        }
        input.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const v = input.value.trim(); if (!v) return;
            tasks.unshift({ id: Date.now() + Math.random(), text: v, time: Date.now(), done: false });
            input.value = ''; save(); render();
        });
        document.getElementById('filters').onclick = e => {
            if (e.target.dataset.f) { filter = e.target.dataset.f; save(); render() }
            else if (e.target.dataset.s) { sortOn = !sortOn; save(); render() }
        };
        render();
    </script>
</body>

</html>
